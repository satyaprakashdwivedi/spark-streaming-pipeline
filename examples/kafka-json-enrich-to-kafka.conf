# Kafka JSON orders -> parse -> enrich with customer reference data -> high-value orders to another topic.
# Start Kafka with:  docker compose up -d   (see README)
kafka = "localhost:9092"
kafka = ${?KAFKA_BOOTSTRAP_SERVERS}
checkpoints = "/tmp/spark-checkpoints"
checkpoints = ${?CHECKPOINT_ROOT}

app {
  name = orders-enrichment
  logLevel = WARN
  sparkConf { "spark.sql.shuffle.partitions" = 4 }
}

steps = [
  { name = orders_raw, type = source.kafka,
    options { bootstrapServers = ${kafka}, subscribe = orders, startingOffsets = earliest, maxOffsetsPerTrigger = 10000 } }

  { name = orders, type = transform.json,
    options {
      schema = "order_id STRING, customer_id STRING, amount DOUBLE, currency STRING, created_at TIMESTAMP"
      dropMalformed = true
    } }

  { name = enriched, type = transform.lookup,
    options {
      format = csv, path = "examples/data/customers.csv", readerOptions { header = true }
      on = [customer_id], select = [customer_id, segment, city], joinType = left
    } }

  { name = high_value, type = transform.sql,
    options { query = """
      SELECT order_id, customer_id, segment, city, amount, currency, created_at,
             current_timestamp() AS processed_at
      FROM enriched
      WHERE amount >= 1000
    """ } }

  { name = to_kafka, type = sink.kafka,
    options {
      bootstrapServers = ${kafka}, topic = orders-high-value, keyColumn = order_id
      checkpointLocation = ${checkpoints}"/orders-high-value"
      trigger { processingTime = "10 seconds" }
    } }

  # also watch the enriched stream while developing
  { name = debug, type = sink.console, input = enriched, options { trigger { processingTime = "10 seconds" } } }
]
