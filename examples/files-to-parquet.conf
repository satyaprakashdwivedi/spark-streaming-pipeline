# New JSON files landing in a folder -> clean -> partitioned Parquet (works with s3a://, abfss://, gs://, hdfs:// paths too).
app { name = files-to-parquet, logLevel = WARN }

steps = [
  { name = landing, type = source.file,
    options {
      format = json, path = "/tmp/landing/events", maxFilesPerTrigger = 20
      schema = "event_id STRING, user_id STRING, event_type STRING, event_time TIMESTAMP, payload STRING"
    } }

  { name = with_time, type = transform.watermark, options { column = event_time, delay = "30 minutes" } }

  { name = unique, type = transform.dropDuplicates, options { columns = [event_id, event_time] } }

  { name = shaped, type = transform.withColumns, options { columns { event_date = "to_date(event_time)" } } }

  { name = lake, type = sink.file,
    options {
      format = parquet, path = "/tmp/lake/events", checkpointLocation = "/tmp/lake/_checkpoints/events"
      partitionBy = [event_date], trigger { processingTime = "1 minute" }
    } }
]
