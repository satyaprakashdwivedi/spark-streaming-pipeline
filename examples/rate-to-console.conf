# Runs anywhere with no infrastructure: generates rows and prints them.
app {
  name = rate-demo
  master = "local[2]"
  logLevel = WARN
}

steps = [
  { name = ticks,   type = source.rate, options { rowsPerSecond = 5 } }
  { name = labeled, type = transform.withColumns,
    options { columns { parity = "CASE WHEN value % 2 = 0 THEN 'even' ELSE 'odd' END" } } }
  { name = print,   type = sink.console,
    options { trigger { processingTime = "5 seconds" }, numRows = 10 } }
]
