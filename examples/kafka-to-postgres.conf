# Kafka JSON payments -> per-minute totals -> PostgreSQL table.
# Needs the PostgreSQL JDBC driver: spark-submit --packages org.postgresql:postgresql:42.7.4 ...
# Credentials come from the environment, never from this file: export DB_USER=... DB_PASSWORD=...
kafka = "localhost:9092"
kafka = ${?KAFKA_BOOTSTRAP_SERVERS}

app { name = payments-to-postgres, logLevel = WARN }

steps = [
  { name = payments_raw, type = source.kafka, options { bootstrapServers = ${kafka}, subscribe = payments } }

  { name = payments, type = transform.json,
    options { schema = "payment_id STRING, merchant STRING, amount DOUBLE, paid_at TIMESTAMP", dropMalformed = true } }

  { name = with_time, type = transform.watermark, options { column = paid_at, delay = "2 minutes" } }

  { name = per_minute, type = transform.sql,
    options { query = """
      SELECT window(paid_at, '1 minute').start AS minute, merchant,
             count(*) AS payments, round(sum(amount), 2) AS total
      FROM with_time
      GROUP BY window(paid_at, '1 minute'), merchant
    """ } }

  { name = to_postgres, type = sink.jdbc,
    options {
      url = "jdbc:postgresql://localhost:5432/analytics", table = "public.merchant_minute_totals"
      user = "spark", user = ${?DB_USER}
      password = "spark", password = ${?DB_PASSWORD}
      driver = "org.postgresql.Driver"
      outputMode = append
      checkpointLocation = "/tmp/spark-checkpoints/merchant-minute-totals"
      trigger { processingTime = "30 seconds" }
    } }
]
